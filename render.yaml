# ==========================================================
#  RENDER BLUEPRINT (backend uchun)
#  Render.com "Blueprint" orqali shu faylni o'qib, servisni
#  avtomatik sozlaydi. Maxfiy qiymatlarni (sync: false) Render
#  panelida qo'lda kiritasiz.
#
#  Public sayt (frontend/) va admin panel (admin/) alohida —
#  odatda Vercel'ga deploy qilinadi.
# ==========================================================

services:
  - type: web
    name: ignite-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # MUHIM: NODE_ENV=production bo'lsa npm devDependencies (@types, tsc, tsx,
      # prisma) ni o'rnatmaydi va TypeScript build yiqiladi. Quyidagi sozlama
      # build paytida ularni ham o'rnatishga majbur qiladi.
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NPM_CONFIG_INCLUDE
        value: dev
      # PORT'ni Render avtomatik beradi - tegmaymiz

      # --- Baza ---
      - key: DATABASE_URL
        sync: false # Neon connection string (qo'lda kiritiladi)

      # --- Auth ---
      - key: JWT_SECRET
        generateValue: true # Render tasodifiy qiymat yaratadi
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: REFRESH_TOKEN_DAYS
        value: "30"

      # --- Manzillar ---
      # CORS_ORIGIN: admin va public sayt manzillari, vergul bilan
      - key: CORS_ORIGIN
        sync: false # masalan: https://ignite.uz,https://admin.ignite.uz
      # Bu servisning o'z manzili (OAuth callback shu asosda quriladi)
      - key: OAUTH_CALLBACK_BASE
        sync: false # masalan: https://api.ignite.uz (noto'g'ri bo'lsa OAuth "redirect_uri_mismatch" beradi)
      # Public sayt manzili (OAuth redirect va email havolalari uchun)
      - key: FRONTEND_URL
        sync: false # masalan: https://ignite.uz

      # --- OAuth (ixtiyoriy: bo'sh bo'lsa provayder o'chiq) ---
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false

      # --- Telegram Login (ixtiyoriy) ---
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      # Avtoposting kanali (@kanal yoki -100...). Bo'sh bo'lsa avtoposting o'chiq.
      # Bot kanalga admin sifatida qo'shilgan bo'lishi shart.
      - key: TELEGRAM_CHANNEL_ID
        sync: false

      # --- Email ---
      # DIQQAT: production'da RESEND_API_KEY bo'lmasa ro'yxatdan o'tish va
      # parol tiklash ishlamaydi (aniq xato qaytariladi).
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

      # --- Media ---
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: ignite-blog

      # --- Birinchi admin (seed) ---
      - key: ADMIN_NAME
        value: Super Admin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # --- Rate limiting ---
      - key: RATE_LIMIT_WINDOW_MINUTES
        value: "15"
      - key: RATE_LIMIT_MAX
        value: "300"
      - key: RATE_LIMIT_READ_MAX
        value: "2000"
      # Frontend (Vercel) dagi INTERNAL_API_TOKEN bilan AYNAN bir xil qiymat.
      # SSR so'rovlarini rate limitdan chiqaradi — busiz butun public sayt
      # bitta IP sifatida limitga uriladi.
      - key: INTERNAL_API_TOKEN
        sync: false
