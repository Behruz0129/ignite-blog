# ==========================================================
#  RENDER BLUEPRINT (backend uchun)
#  Render.com "Blueprint" orqali shu faylni o'qib, servisni
#  avtomatik sozlaydi. Maxfiy qiymatlarni (sync: false) Render
#  panelida qo'lda kiritasiz.
# ==========================================================

services:
  - type: web
    name: ignite-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # MUHIM: NODE_ENV=production bo'lsa npm devDependencies (@types, tsc, tsx,
      # prisma) ni o'rnatmaydi va TypeScript build yiqiladi. Quyidagi sozlama
      # build paytida ularni ham o'rnatishga majbur qiladi.
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NPM_CONFIG_INCLUDE
        value: dev
      # PORT'ni Render avtomatik beradi - tegmaymiz
      - key: DATABASE_URL
        sync: false # Neon connection string (qo'lda kiritiladi)
      - key: JWT_SECRET
        generateValue: true # Render tasodifiy qiymat yaratadi
      - key: JWT_EXPIRES_IN
        value: 7d
      # Ruxsat etilgan originlar, vergul bilan. Masalan:
      # https://ignite.uz,https://www.ignite.uz,https://admin.ignite.uz
      - key: CORS_ORIGIN
        sync: false
      # Ommaviy sayt manzili: email havolalari (parol tiklash, tasdiqlash) va
      # OAuth'dan keyingi qaytish shu yerga ishora qiladi.
      - key: FRONTEND_URL
        sync: false # masalan: https://ignite.uz
      # Backend'ning o'z ommaviy manzili — Google/Discord callback shundan
      # quriladi. Noto'g'ri bo'lsa OAuth "redirect_uri_mismatch" beradi.
      - key: OAUTH_CALLBACK_BASE
        sync: false # masalan: https://api.ignite.uz
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: ignite-blog
      - key: ADMIN_NAME
        value: Super Admin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
